<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoDistribuição | Picuí</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header><div><strong>GeoDistribuição</strong><span>Planejamento territorial de recursos</span></div><div class="source">Picuí — PB · IBGE, Censo 2022</div></header>
<main><aside><h1>Simulação</h1><p class="muted">Distribuição acadêmica entre setores censitários.</p><form id="form-simulacao"><label>Tipo de recurso<input name="tipo_recurso" value="Viatura policial" maxlength="80" required></label><label>Quantidade disponível<input name="quantidade" type="number" min="0" value="10" required></label><label>Estratégia<select name="estrategia" id="estrategia"></select></label><button>Executar simulação</button><button type="button" id="limpar" class="secondary">Limpar simulação</button></form><hr><label>Indicador do mapa<select id="indicador"><option value="densidade_hab_km2">Densidade demográfica</option><option value="populacao_2022">População absoluta</option></select></label><div id="legenda" class="legend"></div></aside>
<section class="map-area"><div id="mapa"></div><div class="map-note">Os marcadores indicam a quantidade atribuída a cada setor; não são localizações operacionais.</div></section>
<aside class="results"><h2>Resultado</h2><div id="estado" class="muted">Carregando setores…</div><div id="resumo"></div><div id="avisos"></div><ol id="distribuicao"></ol></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
